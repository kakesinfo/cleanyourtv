plugins {
    id 'com.android.application'
}

def loadDotEnv() {
    def props = [:]
    [rootProject.file('../.env'), rootProject.file('.env')].each { envFile ->
        if (envFile.isFile()) {
            envFile.eachLine('UTF-8') { line ->
                def trimmed = line.trim()
                if (!trimmed || trimmed.startsWith('#')) return
                def idx = trimmed.indexOf('=')
                if (idx > 0) {
                    def k = trimmed.substring(0, idx).trim()
                    def v = trimmed.substring(idx + 1).trim()
                    if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
                        v = v.substring(1, v.length() - 1)
                    }
                    props[k] = v
                }
            }
        }
    }
    return props
}

def dotEnv = loadDotEnv()
def jellyfinUrl = (dotEnv['JELLYFIN_URL'] ?: System.getenv('JELLYFIN_URL') ?: '').replace('"', '\\"')
def jellyfinApiKey = (dotEnv['JELLYFIN_API_KEY'] ?: System.getenv('JELLYFIN_API_KEY') ?: '').replace('"', '\\"')

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.3'

        resValue "string", "jellyfin_url", "\"${jellyfinUrl}\""
        resValue "string", "jellyfin_api_key", "\"${jellyfinApiKey}\""
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
